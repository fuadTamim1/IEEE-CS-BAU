services:
  web:
    image: nginx:alpine
    container_name: ieee_cs_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app_data:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - ieee_cs_network
    environment:
      - TZ=UTC

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ieee_cs_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - app_data:/var/www/html
    env_file:
      - .env
    networks:
      - ieee_cs_network
    depends_on:
      - mysql
      - redis
    environment:
      - TZ=UTC

  mysql:
    image: mysql:8.4
    container_name: ieee_cs_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - ieee_cs_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ieee_cs_redis
    restart: always
    networks:
      - ieee_cs_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

networks:
  ieee_cs_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  app_data:
    driver: local
