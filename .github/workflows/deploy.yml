name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - deploy        # Push to this branch to deploy in deploy branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧪 Checkout Repo
        uses: actions/checkout@v3

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 Install Dependencies Locally
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader
          npm install
          npm run build

      - name: 🚀 Deploy With rsync (Safe & Fast)
        run: |
          rsync -avz --delete \
          --exclude=".env" \
          --exclude="storage" \
          --exclude="node_modules" \
          --exclude=".git" \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/html/IEEE-CS-BAU/

      - name: 🛠 Run Commands on Hostinger
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /var/www/html/IEEE-CS-BAU &&
            composer install --no-dev --prefer-dist --optimize-autoloader &&
            php artisan migrate --force &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan view:cache
          "
